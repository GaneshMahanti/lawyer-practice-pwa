<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <rect width="512" height="512" rx="112" fill="#0f172a"/>
  <rect x="24" y="24" width="464" height="464" rx="96" fill="#1e293b" stroke="#334155" stroke-width="4"/>
  <!-- Scales of Justice -->
  <g transform="translate(256, 260) scale(1.4)" stroke="#f59e0b" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Center Column -->
    <line x1="0" y1="-100" x2="0" y2="80"/>
    <path d="M-40,80 L40,80" stroke="#f59e0b" stroke-width="12"/>
    <circle cx="0" cy="-105" r="10" fill="#f59e0b"/>
    <!-- Balance Beam -->
    <path d="M-80,-60 L80,-60" stroke-width="10"/>
    <!-- Left Scale -->
    <line x1="-80" y1="-60" x2="-110" y2="-10"/>
    <line x1="-80" y1="-60" x2="-50" y2="-10"/>
    <path d="M-120,-10 C-120,20 -40,20 -40,-10 Z" fill="#f59e0b" fill-opacity="0.2"/>
    <!-- Right Scale -->
    <line x1="80" y1="-60" x2="50" y2="-10"/>
    <line x1="80" y1="-60" x2="110" y2="-10"/>
    <path d="M40,-10 C40,20 120,20 120,-10 Z" fill="#f59e0b" fill-opacity="0.2"/>
  </g>
</svg>
